<style>
:root {

  --bg: #F7F8FA; --white: #FFFFFF; --surf: #F1F3F5; --line: #DDE1E6; --line2: #C4C9D0;
  --mute: #6B7280; --text: #1F2329; --acc: #3B5BDB; --acc-soft: #E7ECFD;

  --dark: #2D3138; --gold: #8A6A00; --gold-soft: #FFF6D6;

}
html.hc { --mute: #3D434B; --line: #8C939C; --line2: #6B7280; --text: #000000; --z1: #FFFFFF; --z2: #E3E6EA; --z3: #C9CDD3; }

html { font-size: var(--base); }

* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }

.sim { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 16px; background: var(--tool); color: var(--tool-fg); font-size: 0.8125rem; }

.brand { display: flex; align-items: center; gap: 10px; }

.brand strong { font-size: 1.125rem; font-weight: 700; }

.hacts { display: flex; gap: 12px; align-items: center; }
.ib { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--line2); border-radius: 8px; background: var(--white); font-size: 0.8125rem; font-weight: 500; cursor: pointer; }
.ib.sq { padding: 7px; }
.steps { display: flex; align-items: center; gap: 10px; padding: 12px 48px; background: var(--white); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.step { display: flex; align-items: center; gap: 8px; font-size: 0.8125rem; color: var(--mute); }
.step .d { width: 24px; height: 24px; border-radius: 999px; border: 1px solid var(--line2); display: grid; place-items: center; font-size: 0.75rem; font-weight: 600; background: var(--white); }
.step.done { color: var(--text); } .step.done .d { background: var(--dark); border-color: var(--dark); color: var(--white); }
.step.on { color: var(--text); font-weight: 600; } .step.on .d { background: var(--acc); border-color: var(--acc); color: var(--white); }
.step + .ln { width: 36px; height: 2px; background: var(--line); } .step.done + .ln { background: var(--dark); }
.steps .of { margin-left: auto; font-size: 0.75rem; color: var(--mute); }

.body { flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 28px 48px; }
.body.center { align-items: center; justify-content: center; text-align: center; }
h1 { margin: 0; font-size: 1.625rem; font-weight: 700; text-wrap: balance; }
h1.big { font-size: 2.125rem; }
.sub { margin: 4px 0 0; color: var(--mute); font-size: 0.9375rem; }
.ttl { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; } .row.between { justify-content: space-between; }
.cols { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
.cols > * { flex: 1 1 320px; min-width: 0; }
.card { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 12px; text-align: left; }
.card.soft { background: var(--surf); }
.card h3 { margin: 0; font-size: 1rem; font-weight: 600; }
.muted { color: var(--mute); }
.small { font-size: 0.8125rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 20px; border-radius: 8px; font-size: 0.9375rem; font-weight: 600; cursor: pointer; border: 1px solid var(--line2); background: var(--white); white-space: nowrap; }
.btn.p { background: var(--acc); border-color: var(--acc); color: #FFFFFF; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 6px 12px; font-size: 0.8125rem; }
.note { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 8px; background: var(--surf); color: var(--mute); font-size: 0.8125rem; align-self: flex-start; text-align: left; }
.note.ok { background: var(--ok-soft); color: var(--ok); } .note.warn { background: var(--warn-soft); color: var(--warn); } .note.acc { background: var(--acc-soft); color: var(--acc); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line2); background: var(--white); font-size: 0.8125rem; cursor: pointer; }
.chip.on { background: var(--acc-soft); border-color: var(--acc); color: var(--acc); font-weight: 600; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 6px; font-size: 0.6875rem; font-weight: 600; }
.tag.ia { background: var(--acc-soft); color: var(--acc); } .tag.eq { background: var(--ok-soft); color: var(--ok); } .tag.mute { background: var(--surf); color: var(--mute); } .tag.gold { background: var(--gold-soft); color: var(--gold); }
.lnk { background: none; border: 0; padding: 0; color: var(--acc); font-weight: 500; font-size: 0.8125rem; cursor: pointer; }
.lnk.w { color: var(--warn); }
.dots { display: inline-flex; gap: 4px; } .dots i { width: 12px; height: 12px; border-radius: 99px; background: var(--line); } .dots i.f { background: var(--dark); }
svg.i { width: 20px; height: 20px; flex: none; }

.land { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.zone { border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 0; display: flex; flex-direction: column; gap: 10px; cursor: pointer; text-align: left; background: var(--z1); overflow: hidden; }
.zone.z2 { background: var(--z2); } .zone.z3 { background: var(--z3); }
.zone.sel { border: 2px solid var(--acc); padding: 17px 17px 0; }
.zone .zh { display: flex; gap: 10px; align-items: center; } .zone .zh b { display: block; font-size: 1.125rem; font-weight: 600; } .zone .zh span { font-size: 0.8125rem; color: var(--mute); }
.occ { min-height: 110px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
.terr { display: block; width: 100%; height: 90px; }
.fig { width: 40px; height: 40px; border-radius: 999px; border: 2px solid var(--dark); background: var(--white); display: grid; place-items: center; }
.you { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--acc); font-size: 0.75rem; font-weight: 600; }

.mstep { padding: 8px 16px; background: var(--white); border-bottom: 1px solid var(--line); font-size: 0.75rem; font-weight: 600; color: var(--acc); }

.code { padding: 16px 24px; border-radius: 10px; background: var(--surf); font-size: 2.75rem; font-weight: 700; align-self: flex-start; letter-spacing: .02em; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; } .seg button { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line2); background: var(--white); font-size: 0.8125rem; cursor: pointer; } .seg button.on { background: var(--acc-soft); border-color: var(--acc); color: var(--acc); font-weight: 600; }
.input { padding: 14px 16px; border-radius: 8px; border: 2px solid var(--warn); font: inherit; font-size: 1.125rem; font-weight: 500; width: 100%; background: var(--white); color: var(--text); }
textarea.input { border-color: var(--acc); font-size: 0.9375rem; font-weight: 400; line-height: 1.5; min-height: 90px; resize: vertical; }
.sw { width: 44px; height: 24px; border-radius: 999px; background: var(--line2); border: 0; padding: 3px; display: flex; cursor: pointer; flex: none; }
.sw::after { content: ""; width: 18px; height: 18px; border-radius: 99px; background: #FFFFFF; }
.sw[aria-checked="true"] { background: var(--acc); justify-content: flex-end; }
.opt { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.opt b { display: block; font-weight: 500; font-size: 0.875rem; } .opt span { font-size: 0.75rem; color: var(--mute); }
.mic { width: 120px; height: 120px; border-radius: 999px; background: var(--acc-soft); display: grid; place-items: center; }
.mic div { width: 72px; height: 72px; border-radius: 999px; background: var(--acc); display: grid; place-items: center; }
.wave { display: flex; gap: 4px; align-items: center; height: 44px; } .wave i { width: 5px; border-radius: 3px; background: var(--acc); animation: wv 1s ease-in-out infinite alternate; }
@keyframes wv { from { transform: scaleY(.5); } to { transform: scaleY(1); } }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); font-size: 0.75rem; font-weight: 600; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 99px; background: var(--ok); }
.quote { padding: 8px 12px; border-radius: 6px; background: var(--surf); font-size: 0.8125rem; }
.slots { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.slot { width: 34px; height: 34px; border-radius: 999px; border: 1.5px dashed var(--line2); display: grid; place-items: center; }
.slot.f { background: var(--acc); border: 1.5px solid var(--acc); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.act.sel { border: 2px solid var(--acc); padding: 23px; }
.mission { background: var(--gold-soft); border: 2px solid var(--gold); }
.snaps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 16px; }
.bars { display: flex; gap: 6px; align-items: flex-end; } .bars div { display: flex; flex-direction: column; gap: 4px; align-items: center; font-size: 0.6875rem; color: var(--mute); } .bars i { width: 56px; border-radius: 4px; border: 1px solid var(--line2); }
.drop { padding: 12px; border-radius: 8px; border: 1.5px dashed var(--acc); background: var(--acc-soft); color: var(--acc); text-align: center; font-size: 0.8125rem; }
.dash { border: 1.5px dashed var(--line2); border-radius: 10px; padding: 12px 14px; display: flex; gap: 8px; align-items: center; color: var(--acc); font-weight: 500; background: transparent; cursor: pointer; }
.toast { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--dark); color: #FFFFFF; padding: 10px 16px; border-radius: 8px; font-size: 0.8125rem; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.help { position: absolute; right: 24px; top: 72px; width: min(340px, calc(100% - 32px)); background: var(--white); border: 1px solid var(--line2); border-radius: 12px; padding: 18px; box-shadow: 0 12px 32px rgba(0,0,0,.14); display: flex; flex-direction: column; gap: 10px; z-index: 5; text-align: left; }

@media (max-width: 760px) {

  .body { padding: 20px 16px; }
  .land { grid-template-columns: 1fr; }
  .steps .ln { display: none; }
  .code { font-size: 2rem; }
  .app { min-height: 0; }

</style>

    <div class="card" style="flex-direction:row;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:14px 18px"><div class="row" style="gap:10px">${ic('boltf', 20, 'var(--acc)')}<b>Te quedan ${left} ficha${left === 1 ? '' : 's'}</b><span class="small muted">· ${left ? 'asígnalas para confirmar' : 'puedes retirar una para moverla'}</span></div>${btn('Confirmar mi voto', 'P15', true, left ? 'disabled' : '')}</div></section>`;
  },
  P15: () => `${header()}${steps(4)}<section class="body" style="gap:16px">${ttl('Misiones para el Sprint 15', '6 de 6 votaron · 18 fichas repartidas', `<button class="ib" data-say="Misión 1: automatizar las pruebas antes de desplegar, 8 fichas. Misión 2: avisar en el canal antes de modificar el entorno de pruebas, 5 fichas.">${ic('speaker', 16)}Escuchar resumen</button>`)}
    <div class="cols" style="gap:20px"><div style="display:flex;flex-direction:column;gap:14px">${[['Automatizar las pruebas antes de desplegar', 8, true], ['Avisar en el canal antes de modificar el entorno de pruebas', 5, false]].map(([t, n, big], i) => `<div class="card ${big ? 'mission' : ''}" style="padding:${big ? '26px' : '20px 22px'}"><div class="row" style="gap:10px;color:var(--gold)">${ic('flag', big ? 26 : 20)}<b class="small">Misión ${i + 1}</b></div><b style="font-size:${big ? '1.375rem' : '1.0625rem'}">${t}</b><div class="row" style="gap:4px;color:var(--gold)">${Array.from({ length: n }, () => ic('boltf', 16)).join('')}<span class="small" style="margin-left:8px;font-weight:500">${n} fichas</span></div></div>`).join('')}</div>
    <div class="card soft" style="flex:0 1 400px;padding:20px;gap:10px"><div class="row" style="gap:8px">${ic('snow', 20, 'var(--mute)')}<b>Valle de ideas congeladas</b></div><p class="small muted" style="margin:0">No se adoptaron esta vez. Se guardan para proponerlas en otro sprint.</p>${[['Limitar la planificación a una hora', 3], ['Definir criterios de terminado por historia', 2]].map(([t, n]) => `<div class="card" style="padding:12px 14px;gap:4px"><span class="muted" style="font-weight:500">${t}</span><span class="small muted">${n} fichas</span></div>`).join('')}</div></div>
    <div class="row between">${note('lock', 'Los votos individuales no se muestran: solo los totales.')}${btn('Registrar misiones en el sprint', 'P16', true)}</div></section>`,
  P16: () => `${header('Equipo Atlas')}<section class="body" style="gap:18px">${ttl('Evolución del equipo Atlas', 'Vista para Product Owner y Agile Coach: solo datos agregados, sin comentarios identificables.')}
    <div class="snaps">${[['Sprint 11', [1, 2, 3]], ['Sprint 12', [1, 3, 2]], ['Sprint 13', [2, 3, 1]], ['Sprint 14', [2, 3, 1]]].map(([s, v]) => `<div class="card" style="padding:16px;gap:10px"><b>${s}</b><div class="bars">${['Cima', 'Valle', 'Tormenta'].map((z, i) => `<div><i style="height:${18 + v[i] * 22}px;background:var(--z${i + 1})"></i>${z} ${v[i]}</div>`).join('')}</div></div>`).join('')}</div>
    <div class="cols" style="gap:20px"><div class="card" style="padding:20px;gap:10px"><h3>Temas recurrentes</h3>${[['Bloqueos con el entorno de pruebas', '3 sprints seguidos'], ['Comunicación entre equipos', '2 de los últimos 4 sprints'], ['Reuniones largas', '2 de los últimos 4 sprints']].map(([t, d]) => `<div class="row between"><span>${t}</span>${tag(d, 'mute')}</div>`).join('')}</div>
    <div class="card" style="padding:20px;gap:10px"><h3>Misiones por sprint</h3>${[['Retro 14', 'Automatizar las pruebas antes de desplegar (8)'], ['Retro 14', 'Avisar antes de modificar el entorno de pruebas (5)'], ['Retro 13', 'Reducir la daily a 15 minutos (6)']].map(([s, m]) => `<div class="row" style="gap:10px">${tag(s, 'gold')}<span class="small">${m}</span></div>`).join('')}</div></div>
    <div class="row end">${btn('Salir', 'P01')}</div></section>`,
  P17: () => `${header('')}<section class="body">${ttl('Preferencias', 'Se guardan en este dispositivo, sin cuenta, y se aplican al instante.')}
    <div class="cols"><div class="card" style="flex:0 1 540px;gap:18px"><h3>Visualización</h3>${[['hc', 'Alto contraste', 'Aumenta el contraste de textos y bordes'], ['focus', 'Modo enfoque', 'Muestra una tarea a la vez y pausa animaciones'], ['rm', 'Reducir animaciones', 'Reemplaza las animaciones por mensajes de texto']].map(([k, l, d]) => `<div class="opt"><div><b id="lbl-${k}">${l}</b><span>${d}</span></div><button class="sw" role="switch" aria-labelledby="lbl-${k}" aria-checked="${st[k]}" data-toggle="${k}"></button></div>`).join('')}
      <label for="size" style="font-weight:500">Tamaño de texto</label><div class="row"><span class="small">A</span><input type="range" id="size" min="100" max="150" step="25" value="${st.size}" style="flex:1"><b style="font-size:1.25rem">A</b><span class="small muted">${st.size} %</span></div></div>
    <div class="card"><h3>Voz y dictado</h3><b style="font-weight:500">Tiempo de espera antes de cortar el dictado</b><div class="seg" role="radiogroup" aria-label="Tiempo de espera">${['1,5 s', '3 s', '5 s'].map((t, i) => `<button role="radio" aria-checked="${st.wait === i}" class="${st.wait === i ? 'on' : ''}" data-wait="${i}">${t}</button>`).join('')}</div>
      ${st.wait !== 2 ? `<div class="card" style="background:var(--acc-soft);border-color:var(--acc);padding:16px;gap:10px"><div class="row" style="gap:8px;color:var(--acc)">${ic('spark', 18)}<b class="small">Sugerencia según tu uso</b></div><p class="small" style="margin:0;line-height:1.4">Corregiste varias transcripciones en las últimas sesiones. ¿Ampliamos el tiempo de espera a 5 s?</p><div class="row" style="gap:8px"><button class="btn p" data-wait="2">Aplicar</button><button class="btn" data-toast="Puedes cambiarlo cuando quieras.">Ahora no</button></div></div>` : note('check', 'Tiempo de espera ajustado a 5 s.', 'ok')}</div></div>
    <div class="row end">${btn('Guardar', 'back', true)}</div></section>`,
};

let prev = 'P01';
function go(id) {
  if (id === 'back') id = prev && prev !== 'P17' ? prev : 'P01';
  if (!R[id]) id = 'P01';
  if (id !== cur) prev = cur;
  cur = id; helpOpen = false; render();
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
  const sel = document.getElementById('goto'); if (sel) sel.value = id;
  window.scrollTo(0, 0);
}
function render() {
  app.className = 'app' + (cur === 'P06' ? ' mobile' : '');
  app.innerHTML = R[cur]() + (helpOpen ? `<div class="help" role="dialog" aria-label="Ayuda"><b>¿Qué hago aquí?</b><p style="margin:0;line-height:1.45">${HELP[cur]}</p><div class="row end"><button class="btn sm" data-help>Entendido</button></div></div>` : '');
  const doc = document.documentElement;
  doc.classList.toggle('hc', st.hc); doc.classList.toggle('rm', st.rm);
  doc.style.setProperty('--base', (16 * st.size / 125) + 'px');
}
function toast(t) {
  const old = app.querySelector('.toast'); if (old) old.remove();
  const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = t; app.appendChild(d);
  clearTimeout(toastT); toastT = setTimeout(() => d.remove(), 2400);
}
function say(t) {
  try { const u = new SpeechSynthesisUtterance(t); u.lang = 'es-PE'; speechSynthesis.cancel(); speechSynthesis.speak(u); toast('Leyendo en voz alta…'); }
  catch (e) { toast('No se pudo reproducir. El texto sigue disponible en pantalla.'); }
}
app.addEventListener('click', e => {
  const b = e.target.closest('button, [data-go]'); if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.help !== undefined) { helpOpen = !helpOpen; render(); return; }
  if (d.zone !== undefined) { st.zone = +d.zone; render(); return; }
  if (d.mzone !== undefined) { st.mzone = +d.mzone; render(); return; }
  if (d.reason) { const r = d.reason; if (st.reasons.includes(r)) st.reasons = st.reasons.filter(x => x !== r); else if (st.reasons.length < 2) st.reasons.push(r); else { toast('Puedes marcar hasta 2 razones. Quita una para elegir otra.'); return; } render(); return; }
  if (d.mreason) { const r = d.mreason; if (st.mreason.includes(r)) st.mreason = st.mreason.filter(x => x !== r); else if (st.mreason.length < 2) st.mreason.push(r); else { toast('Puedes marcar hasta 2 razones.'); return; } render(); return; }
  if (d.toggle) { st[d.toggle] = !st[d.toggle]; render(); return; }
  if (d.timer) { st.timer = +d.timer; render(); return; }
  if (d.wait) { st.wait = +d.wait; render(); return; }
  if (d.emotion) { st.emotion = d.emotion; render(); return; }
  if (d.open !== undefined) { st.open[d.open] = !st.open[d.open]; render(); return; }
  if (d.chip !== undefined) { const i = +d.chip, dd = +d.d, used = st.chips.reduce((a, c) => a + c, 0); if (dd > 0 && used >= 3) { toast('Ya usaste tus 3 fichas. Retira una para moverla.'); return; } st.chips[i] = Math.max(0, st.chips[i] + dd); render(); return; }
  if (d.copy) { const v = d.copy; Promise.resolve().then(() => navigator.clipboard.writeText(v)).then(() => toast('Código copiado'), () => toast('Copia el código: ' + v)); return; }
  if (d.say) { say(d.say); return; }
  if (d.focus) { const el = document.getElementById(d.focus); if (el) el.focus(); return; }
  if (d.toast) { toast(d.toast); return; }
  if (d.go) { go(d.go); }
});
app.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'join') go('P04');
  if (e.target.id === 'addact') { const v = document.getElementById('newact').value.trim(); if (!v) { toast('Escribe la acción antes de agregarla.'); return; } st.extraActions.push(v); render(); toast('Acción agregada como «Propuesta del equipo».'); }
});
app.addEventListener('input', e => { if (e.target.id === 'size') { st.size = +e.target.value; render(); document.getElementById('size').focus(); } });
const sel = document.getElementById('goto');
sel.innerHTML = SCREENS.map(([id, n]) => `<option value="${id}">${id} · ${n}</option>`).join('');
sel.addEventListener('change', () => go(sel.value));
document.getElementById('restart').addEventListener('click', () => { location.hash = ''; location.reload(); });
const params = new URLSearchParams(location.search);
if (params.has('shot')) document.documentElement.classList.add('shot');
const h = (location.hash || '').slice(1);
go(R[h] ? h : 'P01');
</script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
